name: Changed-area product contracts
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  actions: read
concurrency:
  group: product-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  public-share:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PRODUCT_PREVIOUS_SHA: ${{ github.event.action == 'synchronize' && github.event.before || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - id: selection
        run: node scripts/select-product-checks.cjs --plan
      - name: Owning Functions test dependencies
        if: steps.selection.outputs.functions == 'true'
        run: npm ci --prefix functions --ignore-scripts
      - name: Isolated legacy PIN reset dependencies
        if: steps.selection.outputs.legacyReset == 'true'
        run: npm ci --prefix functions/legacy-pin-reset --ignore-scripts
      - name: Local Rules emulator Java
        if: steps.selection.outputs.rules == 'true'
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Syntax, hygiene and changed-area contracts
        run: node scripts/ci/product-evidence.cjs node
      - if: steps.selection.outputs.browser == 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Affected browser journeys
        if: steps.selection.outputs.browser == 'true'
        run: node scripts/ci/product-evidence.cjs browser
      - name: Sanitize isolated test evidence
        id: evidence
        if: always()
        run: python3 scripts/ci/sanitize-product-evidence.py
      - name: Retain product qualification evidence
        if: always() && steps.evidence.outcome == 'success'
        # actions/upload-artifact v4.6.2; never upload profiles or the workspace.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            product-ci-artifacts/
            test-results/
          if-no-files-found: error
          retention-days: 30
