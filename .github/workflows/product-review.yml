name: Product review focused contracts
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: product-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  public-share:
    if: github.head_ref == 'product/astra-end-to-end-review'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/i18n.test.cjs tests/public-share-localization.test.cjs tests/pokemon-go-search-syntax.test.cjs
      - name: Anonymous recipient journey
        run: npx playwright test tests/anonymous-public-share.spec.js --project=desktop --workers=1
