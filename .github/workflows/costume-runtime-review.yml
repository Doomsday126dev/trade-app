name: Isolated costume runtime qualification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/costume-runtime-review.yml'
permissions:
  contents: read
jobs:
  costume-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix functions --ignore-scripts
      - name: Official browser dependency archive
        run: |
          if test -f /etc/apt/apt-mirrors.txt; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - run: npx playwright install --with-deps chromium webkit
      - name: Qualify exact isolated runtime and unchanged browser budgets
        run: |
          runtime_dir=$(mktemp -d)
          baseline_dir=$(mktemp -d)
          git worktree add --detach "$runtime_dir" abefd66586d06bcc6253d4b1ae3f1f9196136944
          git archive 77d5a85e297e783a81ecc0977df19babe826ccef | tar -x -C "$baseline_dir"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$runtime_dir/node_modules"
          ln -s "$GITHUB_WORKSPACE/functions/node_modules" "$runtime_dir/functions/node_modules"
          # Current interaction harness dismisses suggestions before opening Advanced.
          # Only tests change; all frontend bytes remain the exact pinned source.
          cp "$GITHUB_WORKSPACE/tests/released-costume-art.spec.js" "$runtime_dir/tests/released-costume-art.spec.js"
          git -C "$runtime_dir" diff --exit-code -- index.html css js data.js sw.js assets manifest.json scripts/pages/frontend-files.json
          cd "$runtime_dir"
          node --test tests/*.test.cjs
          npm run check:pages-release
          node scripts/generate-costume-sprite-runtime.cjs --check
          npx playwright test --config playwright.mobile-events-nav.config.cjs
          npx playwright test --config playwright.classic-shiny.config.cjs
          npx playwright test --config playwright.gender-cleanup.config.cjs
          npx playwright test --config playwright.comparison-shiny.config.cjs
          npx playwright test --config playwright.remaining-pikachu.config.cjs
          npx playwright test --config playwright.list-polish.config.cjs
          npx playwright test --config playwright.starter-shiny.config.cjs
          npx playwright test --config playwright.form-shiny.config.cjs
          npx playwright test --config playwright.evolution-shiny.config.cjs
          python3 -m http.server 8878 --bind 127.0.0.1 --directory "$runtime_dir" >/tmp/runtime147-server.log 2>&1 &
          candidate_pid=$!
          python3 -m http.server 8879 --bind 127.0.0.1 --directory "$baseline_dir" >/tmp/runtime146-server.log 2>&1 &
          baseline_pid=$!
          trap 'kill "$candidate_pid" "$baseline_pid"' EXIT
          for port in 8878 8879; do
            for attempt in {1..30}; do
              if curl --fail --silent "http://127.0.0.1:$port/" >/dev/null; then break; fi
              sleep 1
            done
          done
          set +e
          echo 'Historical .146 baseline (diagnostic)'
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:8879 npm run test:performance:browser
          baseline_status=$?
          echo 'Exact .147 candidate (all original budgets mandatory)'
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:8878 npm run test:performance:browser
          candidate_status=$?
          set -e
          echo "Baseline status: $baseline_status (diagnostic); candidate status: $candidate_status (mandatory)"
          test "$candidate_status" -eq 0

  consolidated-artwork:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: abefd66586d06bcc6253d4b1ae3f1f9196136944
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Official browser dependency archive
        run: |
          if test -f /etc/apt/apt-mirrors.txt; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - run: npx playwright install --with-deps chromium webkit
      - name: Exact normal Shiny gender size and saved-data journeys
        run: |
          node --test tests/consolidated-shiny-art.test.cjs tests/costume20-shiny-art.test.cjs
          npx playwright test --config playwright.consolidated-shiny.config.cjs
          npx playwright test --config playwright.consolidated-anonymous.config.cjs
