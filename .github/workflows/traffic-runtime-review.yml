name: Isolated catalogue integration qualification
# Qualify the exact catalogue runtime; publication remains protected separately.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/traffic-runtime-review.yml'
permissions:
  contents: read
jobs:
  runtime-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ae196f81834975d705c0fd25a4c1297130516889
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix functions --ignore-scripts
      - name: Official browser dependency archive
        run: |
          if test -f /etc/apt/apt-mirrors.txt; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - run: npx playwright install --with-deps chromium webkit
      - name: Exact combined runtime tests including intercepted traffic privacy journeys
        run: |
          node --test --test-concurrency=2 tests/*.test.cjs
          npm run check:pages-release
      - name: Unchanged browser performance budgets
        run: |
          python3 -m http.server 8878 --bind 127.0.0.1 >/tmp/runtime148-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8878/ >/dev/null; then break; fi
            sleep 1
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:8878 npm run test:performance:browser
      - name: Decode actual packaged brand assets and verify unprimed Favorites
        run: npx playwright test -c playwright.apri151.config.cjs
      - name: Approved Share Events and list-feedback regressions
        run: npx playwright test -c playwright.ui153.config.cjs
      - name: Exact catalogue inventory and form save reload export
        run: npx playwright test -c playwright.catalog-audit.config.cjs
      - name: Released catalogue normal and Shiny journeys
        run: |
          node scripts/prepare-recent-catalog-sprite-fixture.cjs
          CATALOG_SPRITE_CACHE=/tmp/trade-recent-catalog-sprite-cache npx playwright test -c playwright.catalog-repair.config.cjs


  catalogue-browser:
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ae196f81834975d705c0fd25a4c1297130516889
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix functions --ignore-scripts
      - name: Official browser dependency archive
        run: |
          if test -f /etc/apt/apt-mirrors.txt; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - run: npx playwright install --with-deps chromium webkit
      - name: Prepare exact cached artwork for restored ordinary species
        run: node scripts/prepare-recent-catalog-sprite-fixture.cjs --selectable-repair
      - name: Five exact early-want pairs and anonymous privacy journeys
        run: npx playwright test -c playwright.early-want.config.cjs --project=${{ matrix.project }}
      - name: New Max and Thailand exact normal Shiny picker reload and export
        run: npx playwright test -c playwright.catalogue-monitor-followup.config.cjs --project=${{ matrix.project }}
      - name: Exact finite artwork aliases preserved IDs and anonymous export journeys
        env:
          CATALOG_SPRITE_CACHE: /tmp/trade-recent-catalog-sprite-cache
        run: npx playwright test -c playwright.catalogue-followup.config.cjs --project=${{ matrix.project }}

  catalogue-exact:
    if: always()
    needs: [catalogue-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require both complete browser projects
        env:
          BROWSER_RESULT: ${{ needs.catalogue-browser.result }}
        run: test "$BROWSER_RESULT" = success

  share-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ae196f81834975d705c0fd25a4c1297130516889
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Official browser dependency archive
        run: |
          if test -f /etc/apt/apt-mirrors.txt; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - run: npx playwright install --with-deps chromium webkit
      - name: Exact Share states Favorites order and Apri install icon qualification
        run: npx playwright test -c playwright.share-refinement.config.cjs

      - name: Exact Halloween artwork and approved Options journeys
        run: |
          npx playwright test -c playwright.halloween.config.cjs
          npx playwright test -c playwright.apri.config.cjs tests/apri-options.spec.js
      - name: Optional owner variant clarification and preserved data journeys
        run: npx playwright test -c playwright.variant-clarification.config.cjs

  background-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ae196f81834975d705c0fd25a4c1297130516889
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Official browser dependency archive
        run: |
          if test -f /etc/apt/apt-mirrors.txt; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - run: npx playwright install --with-deps chromium webkit
      - name: Bounded Rules and actual authenticated editor journeys
        run: >-
          npx --yes firebase-tools@13.31.2 emulators:exec --only auth,database --project demo-pogo-background-reference
          --config proposals/background-v2/bounded-reference/firebase.json
          'node --test proposals/background-v2/bounded-reference/test.cjs && npx playwright test --config=playwright.background-authenticated.config.cjs'
      - name: Current public read and revocation boundary
        run: >-
          npx --yes firebase-tools@13.31.2 emulators:exec --only auth,database --project demo-pogo-background-reference
          --config proposals/background-v2/bounded-reference/current.firebase.json
          'node --test proposals/background-v2/bounded-reference/current-public.test.cjs'
      - name: Guarded journal and complete ordinary-editor regression
        run: |
          node --test tests/account-sync-indexeddb.test.cjs
          npx playwright test --config=playwright.background-editor-qa.config.cjs
          npx playwright test --config=playwright.background-editor-cancel.config.cjs

  traffic-runtime:
    if: always()
    needs: [runtime-core, share-runtime, background-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require exact runtime core and complete Share Favorites icon journeys
        env:
          CORE_RESULT: ${{ needs.runtime-core.result }}
          SHARE_RESULT: ${{ needs.share-runtime.result }}
          BACKGROUND_RESULT: ${{ needs.background-runtime.result }}
        run: test "$CORE_RESULT" = success && test "$SHARE_RESULT" = success && test "$BACKGROUND_RESULT" = success
