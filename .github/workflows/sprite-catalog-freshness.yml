name: Sprite catalog freshness

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 1 * *'

permissions:
  contents: read

jobs:
  reviewed-sprite-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Verify reviewed assets and generated runtime
        run: |
          node scripts/generate-costume-sprite-runtime.cjs --check
          node scripts/generate-public-sprite-dex.cjs --check
      - name: Detect upstream sprite inventory changes
        run: node scripts/check-costume-sprite-freshness.cjs
