name: Deploy approved Pages release

on:
  workflow_dispatch:
    inputs:
      runtime_source_sha:
        description: Full lowercase 40-character SHA resolved by the immutable runtime tag
        required: true
        type: string
      runtime_release_id:
        description: Runtime release ID without the release- prefix
        required: true
        type: string
      runtime_release_tag:
        description: Immutable runtime tag that resolves to runtime_source_sha
        required: true
        type: string
      expected_live_sha:
        description: Exact runtime SHA reported by the currently served deployment manifest
        required: true
        type: string
      mode:
        description: Explicit release or rollback operation
        required: true
        type: choice
        options:
          - release
          - rollback
      confirmation:
        description: Exact DEPLOY/ROLLBACK confirmation required by the runbook
        required: true
        type: string

permissions: {}

jobs:
  deploy:
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    # Pin the reusable control workflow to Commit A's full immutable SHA.
    uses: Doomsday126dev/trade-app/.github/workflows/pages-release-control.yml@b755bb4e600cd7d3b02ee75980a30aa15fc815d3
    with:
      runtime_source_sha: ${{ inputs.runtime_source_sha }}
      runtime_release_id: ${{ inputs.runtime_release_id }}
      runtime_release_tag: ${{ inputs.runtime_release_tag }}
      expected_live_sha: ${{ inputs.expected_live_sha }}
      mode: ${{ inputs.mode }}
      confirmation: ${{ inputs.confirmation }}
      control_selector_tag: ${{ github.ref_name }}
      dispatcher_sha: ${{ github.sha }}
      control_workflow_sha: "b755bb4e600cd7d3b02ee75980a30aa15fc815d3"
