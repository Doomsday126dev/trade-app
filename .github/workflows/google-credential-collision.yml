name: Google credential collision emulator
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/google-credential-collision.yml
      - scripts/check-google-orphan-credential-emulator.sh
      - tests/firebase/firebase.google-orphan-credential.json
      - tests/firebase/google-orphan-credential-emulator.test.cjs
      - js/services/googleAuthAdapter.js
      - functions/package-lock.json
      - functions/package.json
permissions:
  contents: read
jobs:
  synthetic-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - run: npm ci --prefix functions --ignore-scripts
      - run: bash scripts/check-google-orphan-credential-emulator.sh
