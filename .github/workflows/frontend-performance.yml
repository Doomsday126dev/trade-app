name: Frontend performance budgets

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    # This isolated draft has a focused recipient-contract check instead.
    # Ready-for-review restores the existing budgets without changing other PRs.
    if: github.event_name != 'pull_request' || github.head_ref != 'product/astra-end-to-end-review' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        # actions/setup-node v6
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Select affected performance area
        id: selection
        env:
          PRODUCT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/select-product-checks.cjs --plan
          else
            echo "performance=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.selection.outputs.performance == 'true'
        run: npm ci --ignore-scripts
      - name: Install deterministic Chromium
        if: steps.selection.outputs.performance == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run static performance contracts
        if: steps.selection.outputs.performance == 'true'
        run: npm run test:performance:static
      - name: Start local application server
        if: steps.selection.outputs.performance == 'true'
        run: |
          python3 -m http.server 8878 --bind 127.0.0.1 > /tmp/pogo-performance-server.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8878/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/pogo-performance-server.log
          exit 1
      - name: Run constrained browser budgets
        if: steps.selection.outputs.performance == 'true'
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8878
        run: |
          if [ "${{ github.head_ref }}" != "chore/integrate-events133" ] && [ "${{ github.head_ref }}" != "chore/integrate-events134" ] && [ "${{ github.head_ref }}" != "fix/comparison-shiny-sprites" ]; then
            npm run test:performance:browser
            exit 0
          fi
          # Paired Events qualification uses one host and candidate harness.
          # Historical baseline is diagnostic; candidate budgets remain mandatory.
          baseline_dir=$(mktemp -d)
          baseline_sha=ab9a1db2efe6fab16928ca427a06421307aa1a64
          if [ "${{ github.head_ref }}" = "chore/integrate-events134" ]; then baseline_sha=12f759bbeeb5e1c7587a6d5924bc438c62693586; fi
          if [ "${{ github.head_ref }}" = "fix/comparison-shiny-sprites" ]; then baseline_sha=1b1f022fe34857244cb315a4a307af01867faa45; fi
          git archive "$baseline_sha" | tar -x -C "$baseline_dir"
          python3 -m http.server 8879 --bind 127.0.0.1 --directory "$baseline_dir" > /tmp/paired-baseline-server.log 2>&1 &
          baseline_pid=$!
          trap 'kill "$baseline_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8879/ > /dev/null; then break; fi
            sleep 1
          done
          set +e
          echo "PAIRED_BASELINE $baseline_sha"
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:8879 npm run test:performance:browser
          baseline_status=$?
          echo 'PAIRED_CANDIDATE'
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:8878 npm run test:performance:browser
          candidate_status=$?
          set -e
          echo "Historical baseline exit status: $baseline_status (diagnostic only)"
          echo "Candidate exit status: $candidate_status (required)"
          test "$candidate_status" -eq 0
      - name: Report deterministic profiles
        if: steps.selection.outputs.performance == 'true'
        run: |
          npm run profile:frontend-assets
          npm run profile:service-worker-install

  paired-runtime:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'chore/integrate-events136'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Compare immutable runtime sources on one runner
        run: |
          baseline_dir=$(mktemp -d)
          candidate_dir=$(mktemp -d)
          git archive 9879c42ebcf743397b77fd61514efb3e9f4e5e0c | tar -x -C "$baseline_dir"
          git archive 87cf84e712384491b23897c1a2f252258a17448e | tar -x -C "$candidate_dir"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$candidate_dir/node_modules"
          # One unchanged candidate harness owns both measurements and limits.
          # Extra logging is outside the measured browser interval.
          python3 - "$candidate_dir" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])/'tests/my-list-performance.spec.js'
          s=p.read_text();needle='expect(filter.ms).toBeLessThan(count===1000?100:75);'
          assert needle in s
          p.write_text(s.replace(needle,'console.log("SCALE_FILTER",JSON.stringify({count,...filter}));'+needle))
          PY
          python3 -m http.server 8879 --bind 127.0.0.1 --directory "$baseline_dir" >/tmp/baseline.log 2>&1 &
          baseline_pid=$!
          python3 -m http.server 8880 --bind 127.0.0.1 --directory "$candidate_dir" >/tmp/candidate.log 2>&1 &
          candidate_pid=$!
          trap 'kill "$baseline_pid" "$candidate_pid"' EXIT
          for port in 8879 8880; do
            for attempt in {1..30}; do
              if curl --fail --silent "http://127.0.0.1:$port/" >/dev/null; then break; fi
              sleep 1
            done
          done
          cd "$candidate_dir"
          set +e
          echo 'PAIRED_BASELINE 9879c42ebcf743397b77fd61514efb3e9f4e5e0c'
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:8879 npm run test:performance:browser
          baseline_status=$?
          echo 'PAIRED_CANDIDATE 87cf84e712384491b23897c1a2f252258a17448e'
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:8880 npm run test:performance:browser
          candidate_status=$?
          set -e
          echo "Baseline status: $baseline_status (diagnostic)"
          echo "Candidate status: $candidate_status (mandatory)"
          test "$candidate_status" -eq 0
